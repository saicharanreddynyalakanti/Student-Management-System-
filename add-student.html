<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student - Student Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🎓 Student Management System</div>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="students.html">Students</a></li>
      <li><a href="add-student.html" class="active">Add Student</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1 class="page-title" id="formTitle">Add Student</h1>

    <div class="form-card">
      <form id="studentForm">
        <div class="error-text" id="formError"></div>

        <div class="form-row">
          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="number" id="studentId" required>
          </div>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" maxlength="10" required>
          </div>
          <div class="form-group">
            <label for="course">Course</label>
            <select id="course">
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="IT">IT</option>
              
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="year">Year</label>
            <select id="year">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div class="form-group">
            <label for="attendance">Attendance (%)</label>
            <input type="number" id="attendance" min="0" max="100" required>
          </div>
        </div>

        <div class="form-group">
          <label for="marks">Marks (0-100)</label>
          <input type="number" id="marks" min="0" max="100" required>
        </div>

        <button type="submit" class="btn btn-primary">Save Student</button>
      </form>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
