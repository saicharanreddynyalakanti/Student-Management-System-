<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Student Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🎓 Student Management System</div>
    <ul>
      <li><a href="index.html" class="active">Dashboard</a></li>
      <li><a href="students.html">Students</a></li>
      <li><a href="add-student.html">Add Student</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1 class="page-title">Dashboard</h1>

    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Students</h3>
        <p id="totalStudents">0</p>
      </div>
      <div class="stat-card">
        <h3>Male Students</h3>
        <p id="maleStudents">0</p>
      </div>
      <div class="stat-card">
        <h3>Female Students</h3>
        <p id="femaleStudents">0</p>
      </div>
      <div class="stat-card">
        <h3>Average Marks</h3>
        <p id="avgMarks">0%</p>
      </div>
      <div class="stat-card">
        <h3>Average Attendance</h3>
        <p id="avgAttendance">0%</p>
      </div>
      <div class="stat-card low-attendance">
        <h3>Low Attendance</h3>
        <p id="lowAttendance">0</p>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
